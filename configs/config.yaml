# ==============================================================================
# AUTHENTICA AI — Central Configuration Specification
# ==============================================================================

app:
  name: "Authentica AI"
  tagline: "Multimodal AI-Generated Content Detection System"
  version: "1.0.0"
  disclaimer: "This result is an AI-based estimate and is not definitive proof of whether the content was generated by AI."

# Decision Boundaries for 3-Way Classification
# Score S_AI in [0.0, 1.0]
# 0.00 - 0.3999 -> LIKELY HUMAN-CREATED
# 0.40 - 0.4500 -> UNCERTAIN
# 0.4501 - 1.00 -> LIKELY AI-GENERATED
thresholds:
  upper_threshold: 0.45       # S_AI > 0.45  -> LIKELY AI-GENERATED
  lower_threshold: 0.40       # S_AI < 0.40  -> LIKELY HUMAN-CREATED
  # 0.40 <= S_AI <= 0.45      # -> UNCERTAIN

video_thresholds:
  upper_threshold: 0.45       # S_AI > 0.45  -> LIKELY AI-GENERATED
  lower_threshold: 0.40       # S_AI < 0.40  -> LIKELY HUMAN-CREATED
  # 0.40 <= S_AI <= 0.45      # -> UNCERTAIN

# Modality-Specific Model Configurations
models:
  image:
    primary: "umm-maybe/AI-image-detector"
    baseline: "capcheck/ai-image-detection"
    device: "auto"            # "auto", "cuda", or "cpu"
    batch_size: 1
    input_size: [224, 224]

  video:
    sample_frames: 8
    max_duration_sec: 50
    visual_weight: 0.6
    audio_weight: 0.4

# Security & Upload Validation Rules
security:
  max_image_size_mb: 25
  max_audio_size_mb: 50
  max_video_size_mb: 250
  max_text_characters: 50000

  allowed_extensions:
    image: [".jpg", ".jpeg", ".png", ".webp", ".bmp"]
    audio: [".wav", ".mp3", ".flac", ".ogg", ".m4a"]
    video: [".mp4", ".mov", ".avi", ".webm", ".mkv"]
    text: [".txt"]

  allowed_mimes:
    image: ["image/jpeg", "image/png", "image/webp", "image/bmp"]
    audio: ["audio/wav", "audio/x-wav", "audio/mpeg", "audio/mp3", "audio/flac", "audio/ogg", "audio/x-m4a", "audio/m4a"]
    video: ["video/mp4", "video/quicktime", "video/x-msvideo", "video/webm", "video/x-matroska"]
    text: ["text/plain"]

# Logging Configuration
logging:
  level: "INFO"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
