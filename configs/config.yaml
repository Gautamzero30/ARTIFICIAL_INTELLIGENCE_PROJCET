# ==============================================================================
# AUTHENTICA AI — Central Configuration Specification
# ==============================================================================

app:
  name: "Authentica AI"
  tagline: "Multimodal AI-Generated Content Detection System"
  version: "1.0.0"
  disclaimer: "This result is an AI-based estimate and is not definitive proof of whether the content was generated by AI."

# Decision Boundaries for 3-Way Classification
# Score S_AI in [0.0, 1.0]
thresholds:
  upper_threshold: 0.65       # S_AI >= 0.65 -> LIKELY AI-GENERATED
  lower_threshold: 0.35       # S_AI <= 0.35 -> LIKELY HUMAN-CREATED
  # 0.35 < S_AI < 0.65        # -> UNCERTAIN

# Modality-Specific Model Configurations
models:
  image:
    primary: "umm-maybe/AI-image-detector"
    baseline: "capcheck/ai-image-detection"
    device: "auto"            # "auto", "cuda", or "cpu"
    batch_size: 1
    input_size: [224, 224]

  text:
    primary: "Hello-SimpleAI/chatgpt-detector-roberta"
    multilingual: "yaya36095/xlm-roberta-text-detector"
    device: "auto"
    max_length: 512
    min_character_length: 50
    chunk_overlap: 50

  audio:
    primary: "garystafford/wav2vec2-deepfake-voice-detector"
    baseline: "Sara1708/deepfake-audio-wav2vec2"
    device: "auto"
    target_sample_rate: 16000
    chunk_duration_sec: 4.0

  video:
    sample_frames: 8
    max_duration_sec: 60
    visual_weight: 0.6
    audio_weight: 0.4

# Security & Upload Validation Rules
security:
  max_image_size_mb: 15
  max_audio_size_mb: 25
  max_video_size_mb: 50
  max_text_characters: 50000

  allowed_extensions:
    image: [".jpg", ".jpeg", ".png", ".webp", ".bmp"]
    audio: [".wav", ".mp3", ".flac", ".ogg", ".m4a"]
    video: [".mp4", ".mov", ".avi", ".webm", ".mkv"]
    text: [".txt"]

  allowed_mimes:
    image: ["image/jpeg", "image/png", "image/webp", "image/bmp"]
    audio: ["audio/wav", "audio/x-wav", "audio/mpeg", "audio/mp3", "audio/flac", "audio/ogg", "audio/x-m4a", "audio/m4a"]
    video: ["video/mp4", "video/quicktime", "video/x-msvideo", "video/webm", "video/x-matroska"]
    text: ["text/plain"]

# Logging Configuration
logging:
  level: "INFO"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
